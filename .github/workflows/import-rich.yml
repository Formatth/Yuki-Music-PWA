name: Import Rich Music UI

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Yuki Music
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Rich Music source
        uses: actions/checkout@v4
        with:
          repository: ramax100/YT-Music-Mod
          path: upstream
          fetch-depth: 1

      - name: Import upstream frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp -a upstream/public/. public/

          python3 - <<'PY'
          from pathlib import Path
          for name in ('public/app.js', 'public/index.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('YT Music Mod', 'Yuki Music')
              s = s.replace('YT-Music-Mod', 'Yuki Music')
              s = s.replace('Rich Music', 'Yuki Music')
              s = s.replace('http://localhost:3000/api/', 'https://yuki-music-backend.vercel.app/api/')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Remove old Vite scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src
          rm -f manifest.webmanifest
          rm -f package.json package-lock.json

          cat > package.json <<'EOF'
          {
            "name": "yuki-music-pwa",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node -e \"console.log('Yuki Music static PWA')\""
            },
            "engines": {
              "node": ">=20"
            }
          }
          EOF

      - name: Add Yuki PWA manifest
        shell: bash
        run: |
          cat > public/manifest.webmanifest <<'EOF'
          {
            "name": "Yuki Music",
            "short_name": "Yuki Music",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#000000",
            "description": "Yuki Music Progressive Web App"
          }
          EOF

      - name: Configure Vercel API rewrites
        shell: bash
        run: |
          cat > vercel.json <<'EOF'
          {
            "rewrites": [
              {
                "source": "/api/:path*",
                "destination": "https://yuki-music-backend.vercel.app/api/:path*"
              }
            ]
          }
          EOF

      - name: Commit imported UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Rich Music frontend for Yuki Music" || exit 0
          git push
